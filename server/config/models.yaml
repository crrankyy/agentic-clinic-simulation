# Model assignment per role. Model IDs live here, never in code (brief §4).
#
# D-020: every OpenRouter role uses ONE free model. It is the largest free model
# advertising both tool calling and strict structured outputs, which Q-11, Q-15
# and Q-17 all depend on. Using one model for every role also removes any
# role/model confound from the panel-vs-single comparison.
#
# Free-tier limits (D-023): 20 requests/minute, 1000/day. See config/budgets.yaml.

provider:
  base_url: https://openrouter.ai/api/v1
  # D-061: deepseek/deepseek-v4.1-flash, pinned to Together. Chosen by
  # `cli probe` on 2026-09-27 against the real nested schemas (the D-043
  # procedure), forced tool calls:
  #   Together      6/6 OK   hypothesis 5-8 s   orchestrator 4 s   $0.30/$1.20 per M
  #   Fireworks     2/2 OK              17 s                 11 s   $0.22/$0.66
  #   DeepInfra     2/2 OK              23 s                 14 s   $0.14/$0.42
  #   InferenceNet  4/4 OK           63-91 s              36-59 s   $0.035/$0.29
  #   DeepSeek, Parasail: refused by the account's guardrail ("Paid model
  #   training violation (account settings)") -- an account privacy setting,
  #   deliberately left alone.
  # Together for speed: InferenceNet is 10-15x slower and near the 120 s
  # timeout. DeepInfra is the cheaper fallback if cost matters more.
  pin: ["Together"]
  allow_fallbacks: false
  require_parameters: false
  attribution_title: agent-clinic   # Q-06: X-Title only, no HTTP-Referer

# Forced tool calls, as for every run so far, so the mechanism stays comparable.
# The model also supports native structured outputs (json_schema); switching is
# a deliberate decision, not a side effect of the model change.
structured_output:
  method: function_calling

# D-020's rule stands in its surviving half: ONE model for every role, so the
# panel-vs-single comparison has no role/model confound. The ":free" half is
# superseded by D-061 at the user's direction -- this model is paid.
roles:
  patient:       deepseek/deepseek-v4.1-flash
  gatekeeper:    deepseek/deepseek-v4.1-flash
  hypothesis:    deepseek/deepseek-v4.1-flash
  orchestrator:  deepseek/deepseek-v4.1-flash
  finalize:      deepseek/deepseek-v4.1-flash
  challenger:    deepseek/deepseek-v4.1-flash
  cost_steward:  deepseek/deepseek-v4.1-flash
  evidence:      deepseek/deepseek-v4.1-flash

# D-061: bounded output and bounded thinking, per role. Unbounded, hypothesis
# calls reached 32,768 completion tokens three times and 38,987 once (488 s).
# max_tokens includes reasoning. A reply cut off at the limit is repaired with
# "be more concise", not silently truncated.
role_settings:
  default:      {max_tokens: 4000, reasoning: {effort: medium, exclude: true}}
  patient:      {max_tokens: 1500, reasoning: {effort: low, exclude: true}}
  gatekeeper:   {max_tokens: 800,  reasoning: {effort: low, exclude: true}}
  hypothesis:   {max_tokens: 8000, reasoning: {effort: medium, exclude: true}}
  orchestrator: {max_tokens: 4000, reasoning: {effort: medium, exclude: true}}
  finalize:     {max_tokens: 6000, reasoning: {effort: medium, exclude: true}}

# D-021: the judge runs on the Anthropic SDK, NOT OpenRouter. This is an
# explicit, recorded override of brief §0.2. Two reasons: judge calls then do
# not consume the OpenRouter daily allowance, and the judge must never be weaker
# than the agents it grades.
judge:
  sdk: anthropic
  model: claude-opus-5
  max_calls_per_run: 200          # D-037
  # D-046: "subscription" refuses to run if ANTHROPIC_API_KEY or
  # ANTHROPIC_AUTH_TOKEN is set, because the SDK would silently prefer either
  # over the `ant auth login` profile and bill per token. Set to "any" to allow
  # API-key billing deliberately.
  auth: subscription
