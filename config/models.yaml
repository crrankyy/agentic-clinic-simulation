# Model assignment per role. Model IDs live here, never in code (brief §4).
#
# D-020: every OpenRouter role uses ONE free model. It is the largest free model
# advertising both tool calling and strict structured outputs, which Q-11, Q-15
# and Q-17 all depend on. Using one model for every role also removes any
# role/model confound from the panel-vs-single comparison.
#
# Free-tier limits (D-023): 20 requests/minute, 1000/day. See config/budgets.yaml.

provider:
  base_url: https://openrouter.ai/api/v1
  # D-043: one endpoint (Novita), so pinning costs nothing and guarantees a
  # reported run cannot silently change provider mid-way.
  pin: ["Novita"]
  allow_fallbacks: false
  attribution_title: agent-clinic   # Q-06: X-Title only, no HTTP-Referer

# D-043: this model has tools + tool_choice but NO native structured outputs and
# no response_format, so schemas are enforced by a FORCED TOOL CALL. Measured
# against the real nested HypothesisUpdate: 2/2 at ~10s, full 8-item
# differential. Options: function_calling | json_mode | json_schema.
structured_output:
  method: function_calling

roles:
  patient:       inclusionai/ling-3.0-flash-vl:free
  gatekeeper:    inclusionai/ling-3.0-flash-vl:free
  hypothesis:    inclusionai/ling-3.0-flash-vl:free
  orchestrator:  inclusionai/ling-3.0-flash-vl:free
  challenger:    inclusionai/ling-3.0-flash-vl:free
  cost_steward:  inclusionai/ling-3.0-flash-vl:free
  evidence:      inclusionai/ling-3.0-flash-vl:free

# D-021: the judge runs on the Anthropic SDK, NOT OpenRouter. This is an
# explicit, recorded override of brief §0.2. Two reasons: judge calls then do
# not consume the OpenRouter daily allowance, and the judge must never be weaker
# than the agents it grades.
judge:
  sdk: anthropic
  model: claude-opus-5
  max_calls_per_run: 200          # D-037
  # D-046: "subscription" refuses to run if ANTHROPIC_API_KEY or
  # ANTHROPIC_AUTH_TOKEN is set, because the SDK would silently prefer either
  # over the `ant auth login` profile and bill per token. Set to "any" to allow
  # API-key billing deliberately.
  auth: subscription
