# ILLUSTRATIVE test prices in USD. NOT a real fee schedule (Q-13).
#
# These exist so the cost-steward has something to reason about and so relative
# comparisons between runs are meaningful. Absolute figures mean nothing and
# must never be quoted as real healthcare costs.
#
# Unknown tests are priced at the MEDIAN of this table (Q-13): zero would make
# unmatched tests free and invite the doctor to order them; a penalty would
# punish the doctor for the dataset's key naming.

