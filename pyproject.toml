[project]
name = "agentclinic"
version = "0.1.0"
description = "A from-scratch AgentClinic-style clinical encounter simulation (LangGraph + OpenRouter)"
readme = "README.md"
# D-007: the system Python is 3.14, ahead of much of the LangChain/LangGraph
# wheel ecosystem. uv manages its own 3.12 interpreter.
requires-python = ">=3.12,<3.13"

# Q-35 (D-019), amended by D-034 (rapidfuzz dropped with the fuzzy tier) and
# D-021 (anthropic added for the judge). Exact versions are pinned by uv.lock.
dependencies = [
    "langgraph>=0.2,<1",
    "langchain-core>=0.3,<1",
    "langchain-openai>=0.2,<1",
    "anthropic>=0.40",
    "pydantic>=2.9,<3",
    "httpx>=0.28,<0.29",
    "pyyaml>=6,<7",
    "rich>=13,<15",
    "typer>=0.12,<1",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "respx>=0.21,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/agentclinic"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
pythonpath = ["server/scripts", "server/tests"]   # neither is a package
asyncio_mode = "auto"
markers = [
    "live: touches a real network API; deselected by default (brief Section 11)",
]
addopts = "-m 'not live' --strict-markers"
